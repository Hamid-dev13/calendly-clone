version: '3.8'

# docker-compose.dev.yml — développement local avec hot-reload
# Usage: docker compose -f docker-compose.dev.yml up

services:
  db:
    image: postgres:16-alpine
    container_name: calendly_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: calendly
      POSTGRES_PASSWORD: calendly_secret
      POSTGRES_DB: calendly_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendly"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_dev_data:
    driver: local
