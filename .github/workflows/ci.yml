name: CI — Test & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
      - run: npm run test:unit -- --reporter=verbose
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [unit-tests, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXTAUTH_SECRET: "ci-test-secret-32-chars-minimum-ok"
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next/
            public/
            prisma/

  functional-tests:
    name: Functional & Smoke Tests
    runs-on: ubuntu-latest
    needs: [build]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: calendly
          POSTGRES_PASSWORD: calendly_secret
          POSTGRES_DB: calendly_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Run Prisma migration
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://calendly:calendly_secret@localhost:5432/calendly_db"

      - name: Start app
        run: |
          # Avec output: standalone, on copie les fichiers statiques
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          nohup node .next/standalone/server.js > /tmp/app.log 2>&1 &
        env:
          DATABASE_URL: "postgresql://calendly:calendly_secret@localhost:5432/calendly_db"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXTAUTH_SECRET: "ci-test-secret-32-chars-minimum-ok"

      - name: Wait for app
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health 2>/dev/null || echo "000")
            [ "$STATUS" = "200" ] && echo "Ready!" && break
            echo "attempt $i: HTTP $STATUS" && sleep 3
          done
          curl -f http://localhost:3000/api/health || { cat /tmp/app.log; exit 1; }

      - name: Functional tests
        run: bash tests/functional/api.sh
        env:
          BASE_URL: "http://localhost:3000"

      - name: Smoke tests
        run: bash tests/smoke/pages.sh
        env:
          BASE_URL: "http://localhost:3000"

      - name: App logs on failure
        if: failure()
        run: cat /tmp/app.log || true
