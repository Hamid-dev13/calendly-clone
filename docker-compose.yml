version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: calendly_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: calendly
      POSTGRES_PASSWORD: calendly_secret
      POSTGRES_DB: calendly_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: calendly_app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://calendly:calendly_secret@db:5432/calendly_db
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change_me_in_production
    ports:
      - "3000:3000"

volumes:
  postgres_data:
